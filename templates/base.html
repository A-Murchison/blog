{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="{{.Site.BaseURL}}">
  <title>{{block "title" .}}{{.Site.Title}}{{end}}</title>
  <meta name="description" content="{{block "meta-description" .}}{{.Site.Description}}{{end}}">
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0d0b08;
      --surface:      #1a1610;
      --text:         #e8d5a3;
      --muted:        #8b7355;
      --accent:       #d4a017;
      --accent-bright:#f5c242;
      --border:       #3d3020;
      --hover-bg:     #241e14;
      --max-w:        920px;
      --prose-w:      680px;
      --mono:         'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mono);
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      font-size: 0.9375rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-bright); text-decoration: none; }

    /* ── Header ── */
    header { border-bottom: 1px solid var(--border); padding: 1rem 0; background: var(--surface); }
    header nav { max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2rem; }
    .site-title { font-weight: 700; font-size: 0.9375rem; color: var(--accent); flex-shrink: 0; }
    .site-title::before { content: '~/'; color: var(--muted); font-weight: 400; }
    .site-title:hover { color: var(--accent-bright); }
    .nav-links { display: flex; gap: 1.5rem; margin-left: auto; }
    .nav-links a { color: var(--muted); font-size: 0.875rem; transition: color 0.15s; }
    .nav-links a:hover { color: var(--accent-bright); }

    /* ── Main ── */
    main { max-width: var(--max-w); width: 100%; margin: 3rem auto; padding: 0 1.5rem; flex: 1; }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; text-align: center; color: var(--muted); font-size: 0.8125rem; background: var(--surface); }

    /* ── Hero ── */
    .hero { padding: 2.5rem 0 3rem; }
    .hero-prompt { color: var(--muted); font-size: 0.875rem; margin-bottom: 0.75rem; }
    .hero-prompt .cmd { color: var(--accent); }
    .hero-name { font-size: 2.25rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; line-height: 1.2; }
    .hero-tagline { color: var(--muted); font-size: 0.9375rem; margin-bottom: 1.75rem; }
    .hero-tagline .comment { color: var(--muted); }
    .hero-links { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .hero-link {
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      border-radius: 3px;
      font-size: 0.8125rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .hero-link:hover { border-color: var(--accent); color: var(--accent-bright); background: var(--hover-bg); }
    .hero-link--icon { display: inline-flex; align-items: center; gap: 0.4rem; }

    /* ── Section heading ── */
    .section-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    section { margin-bottom: 3rem; }
    .view-all { display: inline-block; margin-top: 1.25rem; color: var(--muted); font-size: 0.875rem; }
    .view-all:hover { color: var(--accent-bright); }

    /* ── Page heading ── */
    .page-heading { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.75rem; color: var(--text); }
    .page-heading .prefix { color: var(--muted); font-weight: 400; }

    /* ── Card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-image {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-image img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .card-image-bg {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1c1810 0%, #282010 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-image-bg--post { background: linear-gradient(135deg, #0e1418 0%, #121d20 100%); }
    .card-placeholder-icon {
      color: var(--border);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      user-select: none;
    }
    .card-body {
      padding: 0.9rem 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .card-body time { font-size: 0.75rem; color: var(--muted); }
    .card-title { font-size: 0.9375rem; font-weight: 600; color: var(--text); line-height: 1.4; }
    .card:hover .card-title { color: var(--accent-bright); }
    .card-desc { font-size: 0.8125rem; color: var(--muted); line-height: 1.5; flex: 1; }
    .card-body .tags { margin-top: auto; padding-top: 0.5rem; }

    /* ── Back link ── */
    .back-link { display: inline-flex; align-items: center; gap: 0.25rem; color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
    .back-link:hover { color: var(--accent-bright); }

    /* ── Post hero image ── */
    .post-hero-image { margin-bottom: 2rem; border-radius: 4px; overflow: hidden; aspect-ratio: 2 / 1; max-width: var(--prose-w); }
    .post-hero-image img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Article ── */
    article { max-width: var(--prose-w); }
    article h1 { font-size: 1.75rem; line-height: 1.3; margin-bottom: 0.5rem; color: var(--text); }
    article .post-meta { color: var(--muted); font-size: 0.8125rem; display: block; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    article h2 { font-size: 1.375rem; margin: 2rem 0 0.75rem; color: var(--text); }
    article h3 { font-size: 1.125rem; margin: 1.75rem 0 0.5rem; color: var(--text); }
    article h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: var(--text); }
    article p { margin-bottom: 1rem; }
    article ul, article ol { margin: 0 0 1rem 1.5rem; }
    article li { margin-bottom: 0.25rem; }
    article pre { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1rem 1.25rem; overflow-x: auto; margin-bottom: 1.25rem; }
    article code { font-family: var(--mono); font-size: 0.875em; background: var(--surface); color: var(--accent-bright); padding: 0.15rem 0.4rem; border-radius: 3px; }
    article pre code { background: none; padding: 0; color: var(--text); }
    article blockquote { border-left: 2px solid var(--accent); padding-left: 1rem; color: var(--muted); margin: 0 0 1rem; }
    article hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    article img { max-width: 100%; border-radius: 3px; }
    article table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    article th, article td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    article th { background: var(--surface); color: var(--accent); }
    article a { color: var(--accent); }
    article a:hover { color: var(--accent-bright); }

    /* ── Tags ── */
    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    article .tags { margin-top: 2rem; }
    .tag { background: var(--surface); border: 1px solid var(--border); padding: 0.15rem 0.6rem; border-radius: 3px; font-size: 0.75rem; color: var(--muted); }
    a.tag:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Static page content ── */
    .page-content { max-width: var(--prose-w); }
    .page-prompt { color: var(--muted); font-size: 0.8125rem; margin-bottom: 1.25rem; }
    .page-prompt .cmd { color: var(--accent); }
    .page-content h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text); }
    .page-content .page-desc { color: var(--muted); font-size: 0.9375rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .page-content h2 { font-size: 1.25rem; margin: 2rem 0 0.75rem; color: var(--text); }
    .page-content h3 { font-size: 1.0625rem; margin: 1.75rem 0 0.5rem; color: var(--text); }
    .page-content p { margin-bottom: 1rem; }
    .page-content ul, .page-content ol { margin: 0 0 1rem 1.5rem; }
    .page-content li { margin-bottom: 0.25rem; }
    .page-content pre { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1rem 1.25rem; overflow-x: auto; margin-bottom: 1.25rem; }
    .page-content code { font-family: var(--mono); font-size: 0.875em; background: var(--surface); color: var(--accent-bright); padding: 0.15rem 0.4rem; border-radius: 3px; }
    .page-content pre code { background: none; padding: 0; color: var(--text); }
    .page-content a { color: var(--accent); }
    .page-content a:hover { color: var(--accent-bright); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .hero-name { font-size: 1.75rem; }
      .card-grid { grid-template-columns: 1fr; }
      main { margin: 2rem auto; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="./" class="site-title">{{.Site.Title}}</a>
      <div class="nav-links">
        <a href="about/">about</a>
        <a href="projects/">projects</a>
        <a href="posts/">posts</a>
      </div>
    </nav>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
  <footer>
    <p>© {{.Year}} {{.Site.Author}} · Built with <a href="https://github.com/A-Murchison/goblog">goblog</a></p>
  </footer>
</body>
</html>
{{end}}
